[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PROJECT_NAME"
version = "0.1.0"
description = "DH pipeline with manifest-based data paths"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0",
    "pyarrow>=24.0",
    "tomli-w>=1.0",
    "openpyxl>=3.1.2",
    "ipykernel>=6.29",
]

[project.optional-dependencies]
# Opt in with: uv add dighum-template[lineage]
# Needed only by projects that declare a `mirror_of` entry in
# data_manifest.toml (see docs/DATA_LINEAGE.md) — `python -m data_io
# overview`/`sync-mirrors` and the inline staleness warning in resolve()
# are no-ops without this, so most projects never need it.
lineage = [
    "dvc>=3.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["data_io", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
